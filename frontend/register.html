<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Task Manager</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-sm p-6 bg-white rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Create Account</h2>
    
    <form id="signup-form" class="space-y-4">
      <div>
        <label for="name" class="block mb-1 text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name" required class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2.5">
      </div>
      <div>
        <label for="email" class="block mb-1 text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" required class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2.5">
      </div>
      <div>
        <label for="password" class="block mb-1 text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2.5">
      </div>
      <button type="submit" class="w-full bg-green-600 text-white p-2 rounded-lg hover:bg-green-700">Sign Up</button>
    </form>

    <p id="signup-error" class="mt-4 text-red-600 text-sm hidden"></p>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
